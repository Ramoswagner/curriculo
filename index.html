<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wagner Quest — A Jornada do Herói</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Montserrat:wght@300;400;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      background: #0a0c14;
    }

    /* Loading Épico */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: radial-gradient(circle at 30% 30%, #1a1f35, #03050b);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1s cubic-bezier(0.65, 0, 0.35, 1);
    }

    .loading-logo {
      position: relative;
      width: 200px;
      height: 200px;
      margin-bottom: 40px;
      animation: logoBreath 2s ease-in-out infinite;
    }

    @keyframes logoBreath {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px #ff6b35); }
      50% { transform: scale(1.1); filter: drop-shadow(0 0 40px #ffd700); }
    }

    .loading-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 900;
      background: linear-gradient(135deg, #fff 0%, #ffd700 50%, #ff6b35 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 8px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .loading-sub {
      color: rgba(255,255,255,0.6);
      font-size: 1.1rem;
      letter-spacing: 4px;
      margin-bottom: 50px;
    }

    .loading-bar-container {
      width: 500px;
      max-width: 80vw;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .loading-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffd700, #ff6b35);
      transition: width 0.2s ease;
      box-shadow: 0 0 30px #ff6b35;
    }

    .loading-tip {
      color: rgba(255,255,255,0.4);
      font-size: 0.9rem;
      letter-spacing: 2px;
    }

    /* HUD Principal */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1000;
    }

    /* Mini Mapa 3D */
    #minimap {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 220px;
      height: 220px;
      background: rgba(10, 15, 25, 0.85);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 215, 0, 0.3);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      overflow: hidden;
      pointer-events: auto;
      transition: all 0.3s ease;
    }

    #minimap:hover {
      transform: scale(1.05);
      border-color: #ffd700;
    }

    #minimap-canvas {
      width: 100%;
      height: 100%;
    }

    .minimap-label {
      position: absolute;
      top: 10px;
      left: 15px;
      color: #ffd700;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    /* Bússola */
    #compass {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 60px;
      background: rgba(10, 15, 25, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,215,0,0.3);
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 0 20px;
      pointer-events: auto;
    }

    .compass-direction {
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      width: 30px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .compass-direction.active {
      color: #ffd700;
      transform: scale(1.3);
      text-shadow: 0 0 15px #ffd700;
    }

    .compass-bar {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      position: relative;
    }

    .compass-indicator {
      position: absolute;
      width: 4px;
      height: 100%;
      background: #ffd700;
      border-radius: 2px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 15px #ffd700;
    }

    /* Status do Herói */
    #hero-status {
      position: absolute;
      bottom: 30px;
      left: 30px;
      background: rgba(10, 15, 25, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,215,0,0.3);
      border-radius: 20px;
      padding: 20px;
      width: 300px;
      pointer-events: auto;
      transition: all 0.3s ease;
    }

    #hero-status:hover {
      border-color: #ffd700;
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .hero-name {
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffd700;
      margin-bottom: 5px;
    }

    .hero-title {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
      margin-bottom: 15px;
      letter-spacing: 1px;
    }

    .stat-bar {
      margin-bottom: 12px;
    }

    .stat-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.8);
      margin-bottom: 4px;
    }

    .stat-bar-bg {
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .stat-bar-fill {
      height: 100%;
      width: 0%;
      transition: width 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .stat-bar-fill.pmo { background: linear-gradient(90deg, #ffd700, #ff6b35); }
    .stat-bar-fill.analytics { background: linear-gradient(90deg, #2ecc71, #27ae60); }
    .stat-bar-fill.automation { background: linear-gradient(90deg, #3498db, #2980b9); }
    .stat-bar-fill.process { background: linear-gradient(90deg, #e74c3c, #c0392b); }

    /* Prompt de Interação */
    #interaction-prompt {
      position: absolute;
      bottom: 150px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #ff6b35, #ffd700);
      border-radius: 60px;
      padding: 16px 40px;
      display: none;
      align-items: center;
      gap: 20px;
      box-shadow: 0 10px 40px rgba(255,107,53,0.5);
      animation: promptGlow 2s ease-in-out infinite;
      pointer-events: none;
      z-index: 2000;
    }

    @keyframes promptGlow {
      0%, 100% { box-shadow: 0 10px 40px rgba(255,107,53,0.5); }
      50% { box-shadow: 0 20px 60px rgba(255,215,0,0.8); }
    }

    .prompt-key {
      background: rgba(255,255,255,0.3);
      border-radius: 15px;
      padding: 8px 20px;
      font-weight: 900;
      font-size: 1.2rem;
      color: #fff;
      letter-spacing: 2px;
    }

    .prompt-text {
      font-weight: 700;
      color: #fff;
      font-size: 1.1rem;
      text-transform: uppercase;
    }

    /* Painel de Informações (Interior) */
    #info-panel {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(20px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 3000;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    #info-panel.active {
      display: flex;
      opacity: 1;
    }

    .info-container {
      width: min(1000px, 90vw);
      max-height: 80vh;
      background: linear-gradient(135deg, #1a1f35, #0f1325);
      border: 2px solid #ffd700;
      border-radius: 40px;
      padding: 40px;
      overflow-y: auto;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
      transform: scale(0.9);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #info-panel.active .info-container {
      transform: scale(1);
    }

    .info-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,215,0,0.3);
    }

    .info-icon {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #ff6b35, #ffd700);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    .info-title {
      flex: 1;
    }

    .info-title h2 {
      font-size: 2rem;
      color: #ffd700;
      margin-bottom: 5px;
      font-family: 'Cinzel', serif;
    }

    .info-title p {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .info-close {
      width: 50px;
      height: 50px;
      border-radius: 15px;
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .info-close:hover {
      background: #ff6b35;
      transform: rotate(90deg);
    }

    .info-content {
      color: #fff;
      line-height: 1.8;
    }

    .info-card {
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
      border-left: 4px solid #ffd700;
    }

    .info-card h3 {
      color: #ffd700;
      margin-bottom: 15px;
      font-size: 1.3rem;
    }

    .info-card ul {
      list-style: none;
    }

    .info-card li {
      margin-bottom: 10px;
      padding-left: 20px;
      position: relative;
    }

    .info-card li::before {
      content: '▹';
      position: absolute;
      left: 0;
      color: #ffd700;
    }

    /* Controles Mobile */
    #mobile-controls {
      position: absolute;
      bottom: 30px;
      right: 30px;
      display: none;
      grid-template-columns: repeat(3, 80px);
      gap: 15px;
      pointer-events: auto;
    }

    .mobile-btn {
      width: 80px;
      height: 80px;
      background: rgba(10,15,25,0.8);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255,215,0,0.3);
      border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffd700;
      font-size: 2rem;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.1s ease;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .mobile-btn:active {
      transform: scale(0.9);
      background: linear-gradient(135deg, #ff6b35, #ffd700);
      color: #fff;
      border-color: transparent;
    }

    .mobile-btn.interact {
      background: linear-gradient(135deg, #ff6b35, #ffd700);
      color: #fff;
      border-color: transparent;
    }

    @media (max-width: 768px) {
      #minimap, #compass, #hero-status {
        display: none;
      }
      #mobile-controls {
        display: grid;
      }
    }
  </style>
</head>

          </div>
          <div class="info-card">
            <h3>📘 Pós-graduação em Gestão de Projetos</h3>

          </div>
          <div class="info-card">
            <h3>🏗️ Engenharia Civil</h3>
            <p>Bacharelado · Concluído</p>
          </div>
        `
      },
      contact: {
        title: 'Contato',
        icon: '🌐',
        content: `
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;">
            <div class="info-card" style="cursor:pointer;" onclick="window.open('mailto:wagnerramoseng@gmail.com')">
              <h3>📧 Email</h3>
              <p>wagnerramoseng@gmail.com</p>
            </div>
            <div class="info-card" style="cursor:pointer;" onclick="window.open('https://linkedin.com/in/engwagnerramos', '_blank')">
              <h3>💼 LinkedIn</h3>
              <p>linkedin.com/in/engwagnerramos</p>
            </div>
            <div class="info-card" style="cursor:pointer;" onclick="window.open('https://github.com/Ramoswagner', '_blank')">

              <p>github.com/Ramoswagner</p>
            </div>
          </div>
        `
      }
    };

    // Loading
    const loadingBar = document.getElementById('loading-bar');
    const loadingTip = document.getElementById('loading-tip');
    const loadingScreen = document.getElementById('loading');
    
    const tips = [
      'Forjando a armadura do herói...',
      'Construindo o reino...',
      'Invocando os espíritos da análise...',
      'Calibrando a bússola mágica...',
      'Preparando as missões...',
      'Quase lá...',
      'Bem-vindo à sua jornada!'
    ];

    let progress = 0;
    function advanceLoading() {
      progress += Math.random() * 15 + 5;
      if (progress > 100) progress = 100;
      
      loadingBar.style.width = progress + '%';
      const tipIndex = Math.floor((progress / 100) * (tips.length - 1));
      loadingTip.textContent = tips[tipIndex];
      
      if (progress < 100) {
        setTimeout(advanceLoading, 150 + Math.random() * 150);
      } else {
        setTimeout(() => {
          loadingScreen.style.opacity = '0';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
            initGame();
          }, 1000);
        }, 500);
      }
    }
    setTimeout(advanceLoading, 300);

    // Three.js Setup
    let scene, camera, renderer, clock;
    let player, mixer, animations = {};
    let buildings = [];
    let nearBuilding = null;
    let keys = {};
    let walkTime = 0;
    let cameraAngle = 0;
    let cameraDistance = 8;
    let cameraHeight = 3;
    
    // Cores do personagem baseadas na foto
    const skinTone = 0xf5d0a9;
    const hairColor = 0x2c1e0e;
    const shirtColor = 0x1a4d8c;
    const pantsColor = 0x2c3e50;
    const shoeColor = 0x34495e;

    function initGame() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87CEEB);
      scene.fog = new THREE.Fog(0x87CEEB, 30, 100);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      document.body.appendChild(renderer.domElement);

      clock = new THREE.Clock();

      setupLights();
      createWorld();
      createCharacter();
      setupEvents();

      // Animar barras de status
      setTimeout(() => {
        document.getElementById('stat-pmo').style.width = '95%';
        document.getElementById('stat-analytics').style.width = '88%';
        document.getElementById('stat-automation').style.width = '85%';
        document.getElementById('stat-process').style.width = '90%';
      }, 500);

      animate();
    }

    function setupLights() {
      const ambient = new THREE.AmbientLight(0x404060);
      scene.add(ambient);

      const sunLight = new THREE.DirectionalLight(0xfff5d1, 1.5);
      sunLight.position.set(30, 40, 20);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 4096;
      sunLight.shadow.mapSize.height = 4096;
      sunLight.shadow.camera.left = -40;
      sunLight.shadow.camera.right = 40;
      sunLight.shadow.camera.top = 40;
      sunLight.shadow.camera.bottom = -40;
      sunLight.shadow.camera.near = 1;
      sunLight.shadow.camera.far = 80;
      sunLight.shadow.bias = -0.0005;
      scene.add(sunLight);

      const fillLight = new THREE.DirectionalLight(0xaaccff, 0.6);
      fillLight.position.set(-20, 20, -20);
      scene.add(fillLight);

      const backLight = new THREE.DirectionalLight(0xffeedd, 0.3);
      backLight.position.set(-10, 10, -30);
      scene.add(backLight);
    }

    function createWorld() {
      // Chão
      const groundGeo = new THREE.CircleGeometry(70, 64);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x4a7a4a, roughness: 0.8 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = 0;
      ground.receiveShadow = true;
      scene.add(ground);

      // Caminhos
      const pathMat = new THREE.MeshStandardMaterial({ color: 0xc9a87c, roughness: 0.7 });
      
      const pathH = new THREE.Mesh(new THREE.PlaneGeometry(120, 6), pathMat);
      pathH.rotation.x = -Math.PI / 2;
      pathH.position.y = 0.01;
      pathH.receiveShadow = true;
      scene.add(pathH);

      const pathV = new THREE.Mesh(new THREE.PlaneGeometry(6, 120), pathMat);
      pathV.rotation.x = -Math.PI / 2;
      pathV.position.y = 0.01;
      pathV.receiveShadow = true;
      scene.add(pathV);

      // Prédios (Templos do Conhecimento)
      const buildingPositions = [
        { key: 'about', pos: [0, 0, -25], color: 0xffaa77, name: 'Templo do Resumo' },
        { key: 'experience', pos: [20, 0, -10], color: 0x77dd77, name: 'Forja da Experiência' },
        { key: 'skills', pos: [-20, 0, -10], color: 0xaa88ff, name: 'Torre das Habilidades' },
        { key: 'projects', pos: [20, 0, 10], color: 0x88aaff, name: 'Salão dos Projetos' },
        { key: 'education', pos: [-20, 0, 10], color: 0xff88aa, name: 'Biblioteca Real' },
        { key: 'contact', pos: [0, 0, 25], color: 0x88ddff, name: 'Portal do Contato' }
      ];

      buildingPositions.forEach(data => {
        const group = new THREE.Group();
        const [x, y, z] = data.pos;

        // Base
        const baseMat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.3 });
        const base = new THREE.Mesh(new THREE.BoxGeometry(6, 4, 6), baseMat);
        base.position.y = 2;
        base.castShadow = true;
        base.receiveShadow = true;
        group.add(base);

        // Colunas
        const columnMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee });
        for (let i = 0; i < 4; i++) {
          const angle = (i / 4) * Math.PI * 2;
          const column = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 4), columnMat);
          column.position.set(Math.cos(angle) * 2.5, 2, Math.sin(angle) * 2.5);
          column.castShadow = true;
          column.receiveShadow = true;
          group.add(column);
        }

        // Telhado
        const roofMat = new THREE.MeshStandardMaterial({ color: 0xccaa88 });
        const roof = new THREE.Mesh(new THREE.ConeGeometry(3.5, 2, 8), roofMat);
        roof.position.y = 5;
        roof.castShadow = true;
        group.add(roof);

        // Orbe flutuante
        const orbMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0x442200 });
        const orb = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16), orbMat);
        orb.position.y = 6.5;
        orb.castShadow = true;
        group.add(orb);

        group.position.set(x, y, z);
        scene.add(group);

        buildings.push({
          key: data.key,
          group,
          center: new THREE.Vector3(x, 2, z),
          radius: 5,
          name: data.name
        });
      });

      // Árvores
      const treePositions = [
        [-8, -15], [8, -15], [-12, -20], [12, -20],
        [-20, -8], [20, -8], [-20, 8], [20, 8],
        [-8, 15], [8, 15], [-12, 20], [12, 20]
      ];

      treePositions.forEach(([x, z]) => {
        const group = new THREE.Group();
        
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1, 3), trunkMat);
        trunk.position.y = 1.5;
        trunk.castShadow = true;
        trunk.receiveShadow = true;
        group.add(trunk);

        const leafMat = new THREE.MeshStandardMaterial({ color: 0x3cb371 });
        for (let i = 0; i < 6; i++) {
          const leaf = new THREE.Mesh(new THREE.SphereGeometry(1.2 - i * 0.15, 8), leafMat);
          leaf.position.set(0, 2.5 + i * 0.8, 0);
          leaf.castShadow = true;
          leaf.receiveShadow = true;
          group.add(leaf);
        }

        group.position.set(x, 0, z);
        scene.add(group);
      });

      // Nuvens
      const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
      for (let i = 0; i < 8; i++) {
        const group = new THREE.Group();
        const cloudX = (Math.random() - 0.5) * 60;
        const cloudZ = (Math.random() - 0.5) * 60;
        const cloudY = 15 + Math.random() * 10;

        for (let j = 0; j < 5; j++) {
          const sphere = new THREE.Mesh(new THREE.SphereGeometry(1.2 + Math.random(), 6), cloudMat);
          sphere.position.set((j - 2) * 1.5, 0, 0);
          group.add(sphere);
        }

        group.position.set(cloudX, cloudY, cloudZ);
        scene.add(group);
      }
    }

    function createCharacter() {
      player = new THREE.Group();

      // Corpo (camisa)
      const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.6, 8);
      const bodyMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.4 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.9;
      body.castShadow = true;
      body.receiveShadow = true;
      player.add(body);

      // Cabeça (baseada na foto)
      const headGeo = new THREE.SphereGeometry(0.5, 32);
      const headMat = new THREE.MeshStandardMaterial({ color: skinTone, roughness: 0.3 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 1.8;
      head.castShadow = true;
      head.receiveShadow = true;
      player.add(head);

      // Cabelo (estilo curto)
      const hairMat = new THREE.MeshStandardMaterial({ color: hairColor });
      const hairTop = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8), hairMat);
      hairTop.position.set(0, 2.1, 0.1);
      hairTop.scale.set(1.1, 0.3, 1);
      hairTop.castShadow = true;
      player.add(hairTop);

      const hairFront = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 0.3), hairMat);
      hairFront.position.set(0, 2.0, 0.35);
      hairFront.castShadow = true;
      player.add(hairFront);

      // Olhos
      const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
      const eyeIrisMat = new THREE.MeshStandardMaterial({ color: 0x3d2b1a });
      const eyePupilMat = new THREE.MeshStandardMaterial({ color: 0x000000 });

      [-0.18, 0.18].forEach(x => {
        const eyeWhite = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8), eyeWhiteMat);
        eyeWhite.position.set(x, 1.95, 0.45);
        player.add(eyeWhite);

        const iris = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6), eyeIrisMat);
        iris.position.set(x, 1.95, 0.52);
        player.add(iris);

        const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.04, 4), eyePupilMat);
        pupil.position.set(x, 1.95, 0.56);
        player.add(pupil);
      });

      // Nariz
      const noseMat = new THREE.MeshStandardMaterial({ color: skinTone });
      const nose = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.15, 6), noseMat);
      nose.position.set(0, 1.85, 0.5);
      nose.rotation.x = 0.2;
      nose.castShadow = true;
      player.add(nose);

      // Boca
      const mouthMat = new THREE.MeshStandardMaterial({ color: 0xaa5555 });
      const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.08, 0.02, 4, 8, Math.PI), mouthMat);
      mouth.rotation.z = Math.PI / 2;
      mouth.rotation.x = 0.3;
      mouth.position.set(0, 1.75, 0.5);
      player.add(mouth);

      // Barba (estilo cavanhaque)
      const beardMat = new THREE.MeshStandardMaterial({ color: hairColor });
      const beard = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.15, 6), beardMat);
      beard.position.set(0, 1.7, 0.48);
      beard.rotation.x = 0.3;
      player.add(beard);

      // Braços
      const armMat = new THREE.MeshStandardMaterial({ color: shirtColor });
      [-0.7, 0.7].forEach(x => {
        const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 1.2, 6), armMat);
        arm.position.set(x, 1.3, 0);
        arm.rotation.z = x > 0 ? -0.2 : 0.2;
        arm.castShadow = true;
        arm.receiveShadow = true;
        arm.userData.isArm = true;
        arm.userData.side = x;
        player.add(arm);

        // Mão
        const handMat = new THREE.MeshStandardMaterial({ color: skinTone });
        const hand = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6), handMat);
        hand.position.set(x + (x > 0 ? 0.15 : -0.15), 0.7, 0.1);
        hand.castShadow = true;
        player.add(hand);
      });

      // Calças
      const pantsMat = new THREE.MeshStandardMaterial({ color: pantsColor });
      const pants = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.45, 1.0, 8), pantsMat);
      pants.position.y = 0.4;
      pants.castShadow = true;
      pants.receiveShadow = true;
      player.add(pants);

      // Pernas
      const legMat = new THREE.MeshStandardMaterial({ color: pantsColor });
      [-0.2, 0.2].forEach(x => {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.0, 6), legMat);
        leg.position.set(x, 0.3, 0);
        leg.castShadow = true;
        leg.receiveShadow = true;
        leg.userData.isLeg = true;
        leg.userData.side = x;
        player.add(leg);

        // Pé
        const shoeMat = new THREE.MeshStandardMaterial({ color: shoeColor });
        const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.15, 0.4), shoeMat);
        shoe.position.set(x, -0.2, 0.1);
        shoe.castShadow = true;
        player.add(shoe);
      });

      player.position.set(0, 0, 0);
      scene.add(player);
    }

    function setupEvents() {
      document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        keys[key] = true;
        
        if (key === 'e' && nearBuilding) {
          showInfo(nearBuilding.key);
        }
      });

      document.addEventListener('keyup', (e) => {
        keys[e.key.toLowerCase()] = false;
      });

      // Mobile controls
      document.getElementById('mobile-up').addEventListener('touchstart', () => keys['w'] = true);
      document.getElementById('mobile-up').addEventListener('touchend', () => keys['w'] = false);
      document.getElementById('mobile-down').addEventListener('touchstart', () => keys['s'] = true);
      document.getElementById('mobile-down').addEventListener('touchend', () => keys['s'] = false);
      document.getElementById('mobile-left').addEventListener('touchstart', () => keys['a'] = true);
      document.getElementById('mobile-left').addEventListener('touchend', () => keys['a'] = false);
      document.getElementById('mobile-right').addEventListener('touchstart', () => keys['d'] = true);
      document.getElementById('mobile-right').addEventListener('touchend', () => keys['d'] = false);
      document.getElementById('mobile-interact').addEventListener('click', () => {
        if (nearBuilding) showInfo(nearBuilding.key);
      });
    }

    function showInfo(key) {
      const data = profileData[key];
      if (!data) return;

      const container = document.getElementById('info-container');
      container.innerHTML = `
        <div class="info-header">
          <div class="info-icon">${data.icon}</div>
          <div class="info-title">
            <h2>${data.title}</h2>
            <p>Pressione ESC para fechar</p>
          </div>
          <button class="info-close" onclick="document.getElementById('info-panel').classList.remove('active')">✕</button>
        </div>
        <div class="info-content">
          ${data.content}
        </div>
      `;

      document.getElementById('info-panel').classList.add('active');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.getElementById('info-panel').classList.remove('active');
      }
    });

    document.getElementById('info-panel').addEventListener('click', (e) => {
      if (e.target === document.getElementById('info-panel')) {
        document.getElementById('info-panel').classList.remove('active');
      }
    });

    function updateCompass(direction) {
      const dirs = ['N', 'NE', 'L', 'SE', 'S', 'SO', 'O', 'NO'];
      document.querySelectorAll('.compass-direction').forEach(el => el.classList.remove('active'));
      
      let index = Math.round((direction / (Math.PI * 2)) * 8 + 8) % 8;
      document.getElementById(`dir-${dirs[index].toLowerCase()}`).classList.add('active');
    }

    function updateMinimap() {
      const canvas = document.getElementById('minimap-canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 220, 220);

      // Fundo
      ctx.fillStyle = '#0f1322';
      ctx.fillRect(0, 0, 220, 220);

      // Grid
      ctx.strokeStyle = 'rgba(255,215,0,0.2)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 55, 0);
        ctx.lineTo(i * 55, 220);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * 55);
        ctx.lineTo(220, i * 55);
        ctx.stroke();
      }

      // Prédios
      buildings.forEach(b => {
        const x = (b.center.x + 35) / 70 * 220;
        const y = (b.center.z + 35) / 70 * 220;

        ctx.fillStyle = nearBuilding && nearBuilding.key === b.key ? '#ffd700' : 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.key.charAt(0).toUpperCase(), x, y);
      });

      // Jogador
      if (player) {
        const px = (player.position.x + 35) / 70 * 220;
        const py = (player.position.z + 35) / 70 * 220;

        ctx.fillStyle = '#ff6b35';
        ctx.beginPath();
        ctx.arc(px, py, 8, 0, Math.PI * 2);
        ctx.fill();

        // Direção
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px + Math.sin(cameraAngle) * 15, py + Math.cos(cameraAngle) * 15);
        ctx.stroke();
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);
      const speed = 5.0;

      if (player) {
        const moveDir = new THREE.Vector3();
        if (keys['w'] || keys['arrowup']) moveDir.z -= 1;
        if (keys['s'] || keys['arrowdown']) moveDir.z += 1;
        if (keys['a'] || keys['arrowleft']) moveDir.x -= 1;
        if (keys['d'] || keys['arrowright']) moveDir.x += 1;

        const isMoving = moveDir.length() > 0;

        if (isMoving) {
          moveDir.normalize();
          
          // Movimento baseado na direção da câmera
          const forward = new THREE.Vector3(Math.sin(cameraAngle), 0, Math.cos(cameraAngle));
          const right = new THREE.Vector3(Math.cos(cameraAngle), 0, -Math.sin(cameraAngle));

          const move = forward.multiplyScalar(-moveDir.z).add(right.multiplyScalar(moveDir.x));
          
          player.position.x += move.x * speed * delta;
          player.position.z += move.z * speed * delta;

          // Limites do mapa
          player.position.x = Math.max(-30, Math.min(30, player.position.x));
          player.position.z = Math.max(-30, Math.min(30, player.position.z));

          // Animar caminhada
          walkTime += delta * 10;
          
          player.children.forEach(child => {
            if (child.userData.isLeg) {
              child.rotation.x = Math.sin(walkTime + (child.userData.side > 0 ? Math.PI : 0)) * 0.3;
            }
            if (child.userData.isArm) {
              child.rotation.x = Math.sin(walkTime + (child.userData.side > 0 ? 0 : Math.PI)) * 0.2;
            }
          });

          player.position.y = Math.abs(Math.sin(walkTime * 0.8)) * 0.05;
        } else {
          player.children.forEach(child => {
            if (child.userData.isLeg || child.userData.isArm) {
              child.rotation.x *= 0.9;
            }
          });
          player.position.y *= 0.9;
        }

        // Detectar prédios próximos
        nearBuilding = null;
        let minDist = 7;
        
        buildings.forEach(b => {
          const dist = player.position.distanceTo(b.center);
          if (dist < minDist) {
            minDist = dist;
            nearBuilding = b;
          }
        });

        // Atualizar prompt
        const prompt = document.getElementById('interaction-prompt');
        const promptText = document.getElementById('prompt-text');
        
        if (nearBuilding) {
          prompt.style.display = 'flex';
          promptText.textContent = nearBuilding.name;
        } else {
          prompt.style.display = 'none';
        }

        // Atualizar câmera (terceira pessoa dinâmica)
        cameraAngle += (keys['arrowleft'] ? 0.03 : 0) - (keys['arrowright'] ? 0.03 : 0);
        
        const camX = player.position.x + Math.sin(cameraAngle) * cameraDistance;
        const camY = player.position.y + cameraHeight;
        const camZ = player.position.z + Math.cos(cameraAngle) * cameraDistance;

        camera.position.lerp(new THREE.Vector3(camX, camY, camZ), 0.1);
        camera.lookAt(player.position.clone().add(new THREE.Vector3(0, 1.2, 0)));

        updateCompass(cameraAngle);
        updateMinimap();
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
