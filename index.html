<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Studio · Criador de Avatares</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --dark: #0f172a;
            --darker: #020617;
            --light: #f8fafc;
            --gray: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
            min-height: 100vh;
            color: var(--light);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 40px;
            align-items: start;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .header p {
            color: var(--gray);
            font-size: 18px;
        }

        /* Preview Area */
        .preview-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 500px;
        }

        .preview-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 30px;
        }

        #avatarCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.4);
        }

        /* Status indicators */
        .status-badge {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 4px solid var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .status-online {
            background: var(--success);
            box-shadow: 0 0 20px var(--success);
        }

        .status-busy {
            background: var(--danger);
            box-shadow: 0 0 20px var(--danger);
        }

        .status-away {
            background: var(--warning);
            box-shadow: 0 0 20px var(--warning);
        }

        .level-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border: 4px solid var(--dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: var(--dark);
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.4);
        }

        .level-badge span:first-child {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .level-badge span:last-child {
            font-size: 20px;
            line-height: 1;
        }

        /* Controls Panel */
        .controls-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
        }

        .control-group {
            margin-bottom: 24px;
        }

        .control-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gray);
            margin-bottom: 12px;
            display: block;
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 24px;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .upload-area.has-image {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.05);
        }

        .upload-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .upload-text {
            font-size: 14px;
            color: var(--gray);
        }

        .upload-text strong {
            color: var(--light);
            display: block;
            margin-bottom: 4px;
        }

        input[type="file"] {
            display: none;
        }

        /* Style Buttons */
        .style-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .style-btn {
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            color: var(--light);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .style-btn:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .style-btn.active {
            border-color: var(--primary);
            background: var(--primary);
        }

        .style-btn .emoji {
            font-size: 20px;
        }

        /* Status Toggle */
        .status-options {
            display: flex;
            gap: 10px;
        }

        .status-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            color: var(--light);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-btn:hover {
            transform: translateY(-2px);
        }

        .status-btn.online {
            border-color: var(--success);
            color: var(--success);
        }

        .status-btn.online.active {
            background: var(--success);
            color: white;
        }

        .status-btn.busy {
            border-color: var(--danger);
            color: var(--danger);
        }

        .status-btn.busy.active {
            background: var(--danger);
            color: white;
        }

        .status-btn.away {
            border-color: var(--warning);
            color: var(--warning);
        }

        .status-btn.away.active {
            background: var(--warning);
            color: white;
        }

        /* Range Sliders */
        .slider-container {
            margin-bottom: 16px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }

        /* Action Buttons */
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--light);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--dark);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 16px 24px;
            border-radius: 12px;
            font-weight: 600;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Preset Avatars */
        .presets {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: center;
        }

        .preset {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            overflow: hidden;
        }

        .preset:hover {
            transform: scale(1.1);
            border-color: var(--primary);
        }

        .preset img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
            
            .preview-container {
                width: 250px;
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Avatar Studio</h1>
        <p>Crie avatares profissionais com efeitos e elementos interativos</p>
    </div>

    <div class="container">
        <!-- Preview Section -->
        <div class="preview-section">
            <div class="preview-container" id="previewContainer">
                <canvas id="avatarCanvas" width="300" height="300"></canvas>
                
                <!-- Level Badge -->
                <div class="level-badge" id="levelBadge" style="display: none;">
                    <span>LVL</span>
                    <span id="levelNum">42</span>
                </div>
                
                <!-- Status Indicator -->
                <div class="status-badge status-online" id="statusBadge" style="display: none;">
                    <span id="statusIcon">●</span>
                </div>
            </div>

            <div class="presets" id="presets" style="display: none;">
                <!-- Preset avatars will appear here after upload -->
            </div>

            <div style="text-align: center; color: var(--gray); font-size: 14px; margin-top: 20px;">
                <p>💡 Dica: Clique em "Exportar PNG" para salvar seu avatar com todos os efeitos</p>
            </div>
        </div>

        <!-- Controls Section -->
        <div class="controls-section">
            <!-- Upload -->
            <div class="control-group">
                <label class="control-label">Imagem Base</label>
                <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">
                        <strong>Clique para fazer upload</strong>
                        ou arraste uma imagem aqui
                    </div>
                </div>
                <input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)">
            </div>

            <!-- Shape Style -->
            <div class="control-group">
                <label class="control-label">Formato</label>
                <div class="style-grid">
                    <button class="style-btn active" onclick="setShape('circle', this)">
                        <span class="emoji">⭕</span>
                        <span>Círculo</span>
                    </button>
                    <button class="style-btn" onclick="setShape('rounded', this)">
                        <span class="emoji">▢</span>
                        <span>Arredondado</span>
                    </button>
                    <button class="style-btn" onclick="setShape('square', this)">
                        <span class="emoji">■</span>
                        <span>Quadrado</span>
                    </button>
                </div>
            </div>

            <!-- Border Style -->
            <div class="control-group">
                <label class="control-label">Borda</label>
                <div class="style-grid">
                    <button class="style-btn active" onclick="setBorder('gradient', this)">
                        <span class="emoji">🌈</span>
                        <span>Gradiente</span>
                    </button>
                    <button class="style-btn" onclick="setBorder('solid', this)">
                        <span class="emoji">⚪</span>
                        <span>Sólida</span>
                    </button>
                    <button class="style-btn" onclick="setBorder('none', this)">
                        <span class="emoji">✖</span>
                        <span>Sem Borda</span>
                    </button>
                </div>
            </div>

            <!-- Status -->
            <div class="control-group">
                <label class="control-label">Status</label>
                <div class="status-options">
                    <button class="status-btn online active" onclick="setStatus('online', this)">
                        <span>🟢</span> Online
                    </button>
                    <button class="status-btn busy" onclick="setStatus('busy', this)">
                        <span>🔴</span> Ocupado
                    </button>
                    <button class="status-btn away" onclick="setStatus('away', this)">
                        <span>🟡</span> Ausente
                    </button>
                </div>
                <label style="display: flex; align-items: center; gap: 10px; margin-top: 12px; cursor: pointer;">
                    <input type="checkbox" id="showStatus" checked onchange="toggleStatus()">
                    <span style="font-size: 13px; color: var(--gray);">Mostrar indicador de status</span>
                </label>
            </div>

            <!-- Level Badge -->
            <div class="control-group">
                <label class="control-label">Badge de Nível</label>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                        <input type="checkbox" id="showLevel" onchange="toggleLevel()">
                        <span style="font-size: 13px; color: var(--gray);">Mostrar nível</span>
                    </label>
                    <input type="number" id="levelInput" value="42" min="1" max="999" 
                           style="width: 70px; padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); 
                                  background: rgba(255,255,255,0.05); color: white; font-weight: 600; text-align: center;"
                           onchange="updateLevel()">
                </div>
            </div>

            <!-- Effects -->
            <div class="control-group">
                <label class="control-label">Efeitos</label>
                <div class="slider-container">
                    <div class="slider-header">
                        <span>Sombra</span>
                        <span id="shadowValue">40px</span>
                    </div>
                    <input type="range" min="0" max="100" value="40" oninput="updateShadow(this.value)">
                </div>
                <div class="slider-container">
                    <div class="slider-header">
                        <span>Brilho</span>
                        <span id="glowValue">Médio</span>
                    </div>
                    <input type="range" min="0" max="100" value="50" oninput="updateGlow(this.value)">
                </div>
            </div>

            <!-- Actions -->
            <div class="actions">
                <button class="btn btn-primary" onclick="exportAvatar()">
                    <span>💾</span> Exportar PNG
                </button>
                <button class="btn btn-secondary" onclick="resetAvatar()">
                    <span>↺</span> Reset
                </button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Avatar exportado com sucesso!</div>

    <script>
        // State
        let currentImage = null;
        let currentShape = 'circle';
        let currentBorder = 'gradient';
        let currentStatus = 'online';
        let shadowSize = 40;
        let glowIntensity = 50;

        // Canvas setup
        const canvas = document.getElementById('avatarCanvas');
        const ctx = canvas.getContext('2d');

        // Handle file upload
        function handleFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    currentImage = img;
                    document.getElementById('uploadArea').classList.add('has-image');
                    document.querySelector('.upload-text').innerHTML = '<strong>Imagem carregada!</strong>Clique para trocar';
                    drawAvatar();
                    generatePresets();
                    showToast('Imagem carregada com sucesso!');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Drag and drop
        const uploadArea = document.getElementById('uploadArea');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'var(--primary)';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = 'rgba(255, 255, 255, 0.2)';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'rgba(255, 255, 255, 0.2)';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        currentImage = img;
                        document.getElementById('uploadArea').classList.add('has-image');
                        drawAvatar();
                        generatePresets();
                        showToast('Imagem carregada com sucesso!');
                    };
                    img.src = evt.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Draw avatar on canvas
        function drawAvatar() {
            if (!currentImage) {
                // Draw placeholder
                const gradient = ctx.createLinearGradient(0, 0, 300, 300);
                gradient.addColorStop(0, '#6366f1');
                gradient.addColorStop(1, '#ec4899');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 300, 300);
                
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.font = '60px Inter';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('👤', 150, 150);
                return;
            }

            // Clear canvas
            ctx.clearRect(0, 0, 300, 300);

            // Create clipping path based on shape
            ctx.save();
            createClipPath();
            
            // Draw image
            ctx.drawImage(currentImage, 0, 0, 300, 300);
            ctx.restore();

            // Apply border
            if (currentBorder !== 'none') {
                drawBorder();
            }

            // Apply glow effect
            if (glowIntensity > 0) {
                applyGlow();
            }
        }

        function createClipPath() {
            ctx.beginPath();
            if (currentShape === 'circle') {
                ctx.arc(150, 150, 150, 0, Math.PI * 2);
            } else if (currentShape === 'rounded') {
                roundRect(ctx, 0, 0, 300, 300, 60);
            } else {
                ctx.rect(0, 0, 300, 300);
            }
            ctx.closePath();
            ctx.clip();
        }

        function roundRect(ctx, x, y, width, height, radius) {
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
        }

        function drawBorder() {
            ctx.save();
            ctx.beginPath();
            if (currentShape === 'circle') {
                ctx.arc(150, 150, 145, 0, Math.PI * 2);
            } else if (currentShape === 'rounded') {
                roundRect(ctx, 5, 5, 290, 290, 55);
            } else {
                ctx.rect(5, 5, 290, 290);
            }
            ctx.closePath();
            
            ctx.lineWidth = 10;
            if (currentBorder === 'gradient') {
                const gradient = ctx.createLinearGradient(0, 0, 300, 300);
                gradient.addColorStop(0, '#6366f1');
                gradient.addColorStop(0.5, '#ec4899');
                gradient.addColorStop(1, '#6366f1');
                ctx.strokeStyle = gradient;
            } else {
                ctx.strokeStyle = '#ffffff';
            }
            ctx.stroke();
            ctx.restore();
        }

        function applyGlow() {
            const intensity = glowIntensity / 100;
            ctx.save();
            ctx.shadowColor = `rgba(99, 102, 241, ${intensity})`;
            ctx.shadowBlur = 30 * intensity;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            
            ctx.beginPath();
            if (currentShape === 'circle') {
                ctx.arc(150, 150, 150, 0, Math.PI * 2);
            } else if (currentShape === 'rounded') {
                roundRect(ctx, 0, 0, 300, 300, 60);
            } else {
                ctx.rect(0, 0, 300, 300);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }

        // Control functions
        function setShape(shape, btn) {
            currentShape = shape;
            document.querySelectorAll('.style-btn').forEach(b => {
                if (b.parentElement === btn.parentElement) b.classList.remove('active');
            });
            btn.classList.add('active');
            drawAvatar();
        }

        function setBorder(border, btn) {
            currentBorder = border;
            document.querySelectorAll('.style-btn').forEach(b => {
                if (b.parentElement === btn.parentElement) b.classList.remove('active');
            });
            btn.classList.add('active');
            drawAvatar();
        }

        function setStatus(status, btn) {
            currentStatus = status;
            document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateStatusBadge();
        }

        function toggleStatus() {
            const show = document.getElementById('showStatus').checked;
            document.getElementById('statusBadge').style.display = show ? 'flex' : 'none';
        }

        function updateStatusBadge() {
            const badge = document.getElementById('statusBadge');
            badge.className = 'status-badge status-' + currentStatus;
            
            const icons = {
                online: '●',
                busy: '🛑',
                away: '◐'
            };
            document.getElementById('statusIcon').textContent = icons[currentStatus];
        }

        function toggleLevel() {
            const show = document.getElementById('showLevel').checked;
            document.getElementById('levelBadge').style.display = show ? 'flex' : 'none';
        }

        function updateLevel() {
            const level = document.getElementById('levelInput').value;
            document.getElementById('levelNum').textContent = level;
        }

        function updateShadow(value) {
            shadowSize = value;
            document.getElementById('shadowValue').textContent = value + 'px';
            canvas.style.boxShadow = `0 ${value/2}px ${value}px -${value/4}px rgba(99, 102, 241, 0.4)`;
        }

        function updateGlow(value) {
            glowIntensity = value;
            document.getElementById('glowValue').textContent = value > 70 ? 'Alto' : value > 30 ? 'Médio' : 'Baixo';
            drawAvatar();
        }

        // Generate preset variations
        function generatePresets() {
            const presets = document.getElementById('presets');
            presets.style.display = 'flex';
            presets.innerHTML = '';
            
            const variations = [
                { shape: 'circle', border: 'gradient', filter: 'none' },
                { shape: 'circle', border: 'solid', filter: 'grayscale' },
                { shape: 'rounded', border: 'gradient', filter: 'sepia' },
                { shape: 'circle', border: 'none', filter: 'contrast' }
            ];
            
            variations.forEach((var, idx) => {
                const preset = document.createElement('div');
                preset.className = 'preset';
                preset.onclick = () => applyPreset(var);
                
                const img = document.createElement('canvas');
                img.width = 50;
                img.height = 50;
                const pctx = img.getContext('2d');
                
                // Draw mini version
                pctx.save();
                pctx.beginPath();
                pctx.arc(25, 25, 25, 0, Math.PI * 2);
                pctx.clip();
                pctx.drawImage(currentImage, 0, 0, 50, 50);
                pctx.restore();
                
                preset.appendChild(img);
                presets.appendChild(preset);
            });
        }

        function applyPreset(preset) {
            currentShape = preset.shape;
            currentBorder = preset.border;
            drawAvatar();
            showToast('Preset aplicado!');
        }

        // Export functions
        function exportAvatar() {
            if (!currentImage) {
                showToast('Faça upload de uma imagem primeiro!');
                return;
            }

            // Create export canvas with all elements
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = 400;
            exportCanvas.height = 400;
            const ectx = exportCanvas.getContext('2d');

            // Background
            ectx.fillStyle = 'transparent';
            ectx.clearRect(0, 0, 400, 400);

            // Shadow
            ectx.save();
            ectx.shadowColor = 'rgba(99, 102, 241, 0.4)';
            ectx.shadowBlur = shadowSize;
            ectx.shadowOffsetX = 0;
            ectx.shadowOffsetY = shadowSize / 2;

            // Main avatar
            const offset = 50;
            ectx.save();
            ectx.beginPath();
            if (currentShape === 'circle') {
                ectx.arc(200, 200, 150, 0, Math.PI * 2);
            } else if (currentShape === 'rounded') {
                roundRect(ectx, offset, offset, 300, 300, 60);
            } else {
                ectx.rect(offset, offset, 300, 300);
            }
            ectx.closePath();
            ectx.clip();
            ectx.drawImage(canvas, 0, 0, 300, 300, offset, offset, 300, 300);
            ectx.restore();

            // Border on export
            if (currentBorder !== 'none') {
                ectx.beginPath();
                if (currentShape === 'circle') {
                    ectx.arc(200, 200, 145, 0, Math.PI * 2);
                } else if (currentShape === 'rounded') {
                    roundRect(ectx, offset + 5, offset + 5, 290, 290, 55);
                } else {
                    ectx.rect(offset + 5, offset + 5, 290, 290);
                }
                ectx.closePath();
                ectx.lineWidth = 10;
                if (currentBorder === 'gradient') {
                    const gradient = ectx.createLinearGradient(0, 0, 400, 400);
                    gradient.addColorStop(0, '#6366f1');
                    gradient.addColorStop(0.5, '#ec4899');
                    gradient.addColorStop(1, '#6366f1');
                    ectx.strokeStyle = gradient;
                } else {
                    ectx.strokeStyle = '#ffffff';
                }
                ectx.stroke();
            }
            ectx.restore();

            // Level badge
            if (document.getElementById('showLevel').checked) {
                const level = document.getElementById('levelInput').value;
                ectx.save();
                ectx.beginPath();
                ectx.arc(340, 60, 40, 0, Math.PI * 2);
                ectx.fillStyle = '#f59e0b';
                ectx.fill();
                ectx.lineWidth = 6;
                ectx.strokeStyle = '#0f172a';
                ectx.stroke();
                
                ectx.fillStyle = '#0f172a';
                ectx.font = 'bold 12px Inter';
                ectx.textAlign = 'center';
                ectx.fillText('LVL', 340, 50);
                ectx.font = 'bold 24px Inter';
                ectx.fillText(level, 340, 75);
                ectx.restore();
            }

            // Status badge
            if (document.getElementById('showStatus').checked) {
                const colors = {
                    online: '#10b981',
                    busy: '#ef4444',
                    away: '#f59e0b'
                };
                const icons = {
                    online: '●',
                    busy: '✕',
                    away: '−'
                };
                
                ectx.save();
                ectx.beginPath();
                ectx.arc(340, 340, 25, 0, Math.PI * 2);
                ectx.fillStyle = colors[currentStatus];
                ectx.fill();
                ectx.lineWidth = 4;
                ectx.strokeStyle = '#0f172a';
                ectx.stroke();
                
                ectx.fillStyle = '#ffffff';
                ectx.font = 'bold 16px Inter';
                ectx.textAlign = 'center';
                ectx.textBaseline = 'middle';
                ectx.fillText(icons[currentStatus], 340, 340);
                ectx.restore();
            }

            // Download
            const link = document.createElement('a');
            link.download = `avatar-${Date.now()}.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
            
            showToast('Avatar exportado com sucesso!');
        }

        function resetAvatar() {
            currentImage = null;
            currentShape = 'circle';
            currentBorder = 'gradient';
            currentStatus = 'online';
            shadowSize = 40;
            glowIntensity = 50;
            
            document.getElementById('uploadArea').classList.remove('has-image');
            document.querySelector('.upload-text').innerHTML = '<strong>Clique para fazer upload</strong>ou arraste uma imagem aqui';
            document.getElementById('fileInput').value = '';
            document.getElementById('presets').style.display = 'none';
            
            // Reset controls
            document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.style-btn')[0].classList.add('active');
            document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.status-btn.online').classList.add('active');
            
            canvas.style.boxShadow = '0 25px 50px -12px rgba(99, 102, 241, 0.4)';
            document.getElementById('shadowValue').textContent = '40px';
            document.querySelector('input[type="range"]').value = 40;
            
            drawAvatar();
            showToast('Reset concluído!');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Initialize
        drawAvatar();
        updateStatusBadge();
    </script>
</body>
</html>
