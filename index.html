<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personagem 3D Estilo Pixar</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
    }
    
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
      pointer-events: none;
      z-index: 100;
    }
    
    #controls-hint {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.3);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      backdrop-filter: blur(5px);
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="info">✨ Wagner Douglas - Personagem 3D Estilo Pixar</div>
  <div id="controls-hint">🖱️ Arraste para girar | Scroll para zoom</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ============================================
    // CENA, CÂMERA, RENDERIZADOR
    // ============================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // Céu azul claro
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(3, 2, 5);
    camera.lookAt(0, 1, 0);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Sombras mais suaves
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);
    
    // Controles orbitais
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.0;
    controls.maxPolarAngle = Math.PI / 2; // Não permite ver embaixo do chão
    controls.target.set(0, 1.2, 0);
    
    // ============================================
    // ILUMINAÇÃO ESTILO PIXAR
    // ============================================
    
    // Luz principal (sol) - quente
    const sunLight = new THREE.DirectionalLight(0xfff5d1, 1.5);
    sunLight.position.set(5, 10, 7);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 25;
    sunLight.shadow.camera.left = -10;
    sunLight.shadow.camera.right = 10;
    sunLight.shadow.camera.top = 10;
    sunLight.shadow.camera.bottom = -10;
    sunLight.shadow.bias = -0.0001;
    scene.add(sunLight);
    
    // Luz de preenchimento - fria
    const fillLight = new THREE.DirectionalLight(0xaaccff, 0.8);
    fillLight.position.set(-5, 5, -5);
    scene.add(fillLight);
    
    // Luz ambiente
    const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
    scene.add(ambientLight);
    
    // Luz de rim (contorno)
    const rimLight = new THREE.DirectionalLight(0xffeedd, 0.5);
    rimLight.position.set(-2, 3, -5);
    scene.add(rimLight);
    
    // Pontos de luz para dar brilho nos olhos
    const eyeLight1 = new THREE.PointLight(0xffffff, 0.3);
    eyeLight1.position.set(2, 3, 3);
    scene.add(eyeLight1);
    
    const eyeLight2 = new THREE.PointLight(0xffffff, 0.3);
    eyeLight2.position.set(-2, 3, 3);
    scene.add(eyeLight2);
    
    // ============================================
    // CENÁRIO - GRAMA, FLORES, ÁRVORES
    // ============================================
    
    // Chão com textura de grama
    const groundGeometry = new THREE.CircleGeometry(15, 32);
    
    // Criar textura de grama procedural
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#4a9e4a';
    ctx.fillRect(0, 0, 512, 512);
    
    // Adicionar variação de cor (manchas mais claras/escuras)
    for (let i = 0; i < 2000; i++) {
      const x = Math.random() * 512;
      const y = Math.random() * 512;
      const r = 3 + Math.random() * 5;
      const brightness = 0.8 + Math.random() * 0.4;
      ctx.fillStyle = `rgba(70, 160, 70, ${Math.random() * 0.3})`;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    
    const groundTexture = new THREE.CanvasTexture(canvas);
    groundTexture.wrapS = THREE.RepeatWrapping;
    groundTexture.wrapT = THREE.RepeatWrapping;
    groundTexture.repeat.set(8, 8);
    
    const groundMaterial = new THREE.MeshStandardMaterial({ 
      map: groundTexture,
      roughness: 0.8,
      metalness: 0.1
    });
    
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    ground.receiveShadow = true;
    scene.add(ground);
    
    // Adicionar algumas flores
    function createFlower(x, z, color) {
      const group = new THREE.Group();
      
      // Caule
      const stemMat = new THREE.MeshStandardMaterial({ color: 0x4caf50 });
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.3), stemMat);
      stem.position.y = 0.15;
      group.add(stem);
      
      // Pétalas (5 esferinhas ao redor)
      const petalMat = new THREE.MeshStandardMaterial({ color: color });
      
      for (let i = 0; i < 5; i++) {
        const angle = (i / 5) * Math.PI * 2;
        const petal = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6), petalMat);
        petal.position.set(Math.cos(angle) * 0.15, 0.35, Math.sin(angle) * 0.15);
        group.add(petal);
      }
      
      // Centro
      const centerMat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
      const center = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8), centerMat);
      center.position.y = 0.35;
      group.add(center);
      
      group.position.set(x, 0, z);
      group.castShadow = true;
      group.receiveShadow = true;
      return group;
    }
    
    // Flores coloridas
    const flowerColors = [0xff6b6b, 0xffd93d, 0x6bcb77, 0x4d96ff, 0xff9f9f];
    for (let i = 0; i < 40; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 3 + Math.random() * 8;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      const color = flowerColors[Math.floor(Math.random() * flowerColors.length)];
      const flower = createFlower(x, z, color);
      scene.add(flower);
    }
    
    // Algumas pedras decorativas
    function createStone(x, z, size) {
      const stoneMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.9 });
      const stone = new THREE.Mesh(new THREE.DodecahedronGeometry(size * 0.3, 0), stoneMat);
      stone.position.set(x, size * 0.15, z);
      stone.castShadow = true;
      stone.receiveShadow = true;
      scene.add(stone);
    }
    
    for (let i = 0; i < 15; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 4 + Math.random() * 7;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      createStone(x, z, 0.5 + Math.random() * 0.8);
    }
    
    // Árvores simples
    function createTree(x, z, size = 1) {
      const group = new THREE.Group();
      
      // Tronco
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3 * size, 0.4 * size, 1.5 * size), trunkMat);
      trunk.position.y = 0.75 * size;
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      group.add(trunk);
      
      // Copa (várias esferas)
      const leafMat = new THREE.MeshStandardMaterial({ color: 0x3cb371 });
      
      const leaf1 = new THREE.Mesh(new THREE.SphereGeometry(0.6 * size, 6), leafMat);
      leaf1.position.set(0, 1.6 * size, 0);
      leaf1.castShadow = true;
      leaf1.receiveShadow = true;
      group.add(leaf1);
      
      const leaf2 = new THREE.Mesh(new THREE.SphereGeometry(0.5 * size, 6), leafMat);
      leaf2.position.set(0.4 * size, 2.1 * size, 0.2 * size);
      leaf2.castShadow = true;
      leaf2.receiveShadow = true;
      group.add(leaf2);
      
      const leaf3 = new THREE.Mesh(new THREE.SphereGeometry(0.5 * size, 6), leafMat);
      leaf3.position.set(-0.3 * size, 2.2 * size, -0.3 * size);
      leaf3.castShadow = true;
      leaf3.receiveShadow = true;
      group.add(leaf3);
      
      const leaf4 = new THREE.Mesh(new THREE.SphereGeometry(0.4 * size, 6), leafMat);
      leaf4.position.set(0.2 * size, 1.9 * size, 0.6 * size);
      leaf4.castShadow = true;
      leaf4.receiveShadow = true;
      group.add(leaf4);
      
      group.position.set(x, 0, z);
      return group;
    }
    
    // Adicionar árvores ao redor
    const treePositions = [
      [-5, -4], [6, -5], [-6, 5], [5, 6],
      [-8, -7], [8, -6], [-7, 8], [7, 7],
      [0, -9], [-9, 0], [9, 0], [0, 9]
    ];
    
    treePositions.forEach(([x, z]) => {
      const tree = createTree(x, z, 1 + Math.random() * 0.3);
      scene.add(tree);
    });
    
    // ============================================
    // CRIAÇÃO DO PERSONAGEM ESTILO PIXAR
    // ============================================
    
    const character = new THREE.Group();
    
    // Cores
    const skinColor = 0xffccaa;
    const skinDarkColor = 0xeebb99;
    const eyeWhiteColor = 0xffffff;
    const eyeIrisColor = 0x5d3a1a;
    const eyePupilColor = 0x111111;
    const hairColor = 0x2c1e0e;
    const shirtColor = 0x4169e1; // Azul royal
    const pantsColor = 0x2c3e50;
    const shoeColor = 0x34495e;
    
    // CORPO (torso)
    const torsoGeo = new THREE.CylinderGeometry(0.5, 0.55, 1.2, 8);
    const torsoMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.4, emissive: 0x000000 });
    const torso = new THREE.Mesh(torsoGeo, torsoMat);
    torso.position.y = 0.9;
    torso.castShadow = true;
    torso.receiveShadow = true;
    character.add(torso);
    
    // Gola da camisa
    const collarGeo = new THREE.TorusGeometry(0.4, 0.08, 4, 8, Math.PI);
    collarGeo.rotateX(Math.PI / 2);
    const collarMat = new THREE.MeshStandardMaterial({ color: 0x2a4a8a });
    const collar = new THREE.Mesh(collarGeo, collarMat);
    collar.position.set(0, 1.45, 0);
    collar.castShadow = true;
    character.add(collar);
    
    // PESCOÇO
    const neckGeo = new THREE.CylinderGeometry(0.2, 0.22, 0.2, 6);
    const neckMat = new THREE.MeshStandardMaterial({ color: skinColor });
    const neck = new THREE.Mesh(neckGeo, neckMat);
    neck.position.y = 1.55;
    neck.castShadow = true;
    neck.receiveShadow = true;
    character.add(neck);
    
    // CABEÇA (formato mais cartunesco)
    const headGeo = new THREE.SphereGeometry(0.5, 24, 24);
    const headMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.3 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 2.0;
    head.castShadow = true;
    head.receiveShadow = true;
    character.add(head);
    
    // BOCHECHAS (sutil)
    const cheekGeo = new THREE.SphereGeometry(0.12, 8);
    const cheekMat = new THREE.MeshStandardMaterial({ color: 0xffaa88 });
    
    const cheekL = new THREE.Mesh(cheekGeo, cheekMat);
    cheekL.position.set(-0.4, 1.9, 0.4);
    character.add(cheekL);
    
    const cheekR = new THREE.Mesh(cheekGeo, cheekMat);
    cheekR.position.set(0.4, 1.9, 0.4);
    character.add(cheekR);
    
    // OLHOS - Parte branca
    const eyeWhiteGeo = new THREE.SphereGeometry(0.15, 12);
    const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: eyeWhiteColor, emissive: 0x222222 });
    
    const eyeWhiteL = new THREE.Mesh(eyeWhiteGeo, eyeWhiteMat);
    eyeWhiteL.position.set(-0.22, 2.15, 0.45);
    character.add(eyeWhiteL);
    
    const eyeWhiteR = new THREE.Mesh(eyeWhiteGeo, eyeWhiteMat);
    eyeWhiteR.position.set(0.22, 2.15, 0.45);
    character.add(eyeWhiteR);
    
    // Íris
    const irisGeo = new THREE.SphereGeometry(0.09, 10);
    const irisMat = new THREE.MeshStandardMaterial({ color: eyeIrisColor });
    
    const irisL = new THREE.Mesh(irisGeo, irisMat);
    irisL.position.set(-0.22, 2.15, 0.58);
    character.add(irisL);
    
    const irisR = new THREE.Mesh(irisGeo, irisMat);
    irisR.position.set(0.22, 2.15, 0.58);
    character.add(irisR);
    
    // Pupilas
    const pupilGeo = new THREE.SphereGeometry(0.05, 6);
    const pupilMat = new THREE.MeshStandardMaterial({ color: eyePupilColor });
    
    const pupilL = new THREE.Mesh(pupilGeo, pupilMat);
    pupilL.position.set(-0.22, 2.15, 0.64);
    character.add(pupilL);
    
    const pupilR = new THREE.Mesh(pupilGeo, pupilMat);
    pupilR.position.set(0.22, 2.15, 0.64);
    character.add(pupilR);
    
    // Brilho nos olhos
    const glintGeo = new THREE.SphereGeometry(0.03, 4);
    const glintMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x888888 });
    
    const glintL = new THREE.Mesh(glintGeo, glintMat);
    glintL.position.set(-0.18, 2.18, 0.66);
    character.add(glintL);
    
    const glintR = new THREE.Mesh(glintGeo, glintMat);
    glintR.position.set(0.26, 2.18, 0.66);
    character.add(glintR);
    
    // Nariz
    const noseGeo = new THREE.ConeGeometry(0.12, 0.15, 6);
    const noseMat = new THREE.MeshStandardMaterial({ color: skinDarkColor });
    const nose = new THREE.Mesh(noseGeo, noseMat);
    nose.position.set(0, 2.02, 0.55);
    nose.rotation.x = 0.2;
    nose.castShadow = true;
    character.add(nose);
    
    // Boca (arco)
    const mouthGeo = new THREE.TorusGeometry(0.12, 0.03, 4, 8, Math.PI);
    mouthGeo.rotateZ(Math.PI / 2);
    mouthGeo.rotateX(Math.PI / 4);
    const mouthMat = new THREE.MeshStandardMaterial({ color: 0xaa5555 });
    const mouth = new THREE.Mesh(mouthGeo, mouthMat);
    mouth.position.set(0, 1.94, 0.5);
    mouth.castShadow = true;
    character.add(mouth);
    
    // Sobrancelhas
    const browGeo = new THREE.BoxGeometry(0.3, 0.05, 0.1);
    const browMat = new THREE.MeshStandardMaterial({ color: hairColor });
    
    const browL = new THREE.Mesh(browGeo, browMat);
    browL.position.set(-0.25, 2.28, 0.45);
    browL.rotation.z = 0.1;
    browL.castShadow = true;
    character.add(browL);
    
    const browR = new THREE.Mesh(browGeo, browMat);
    browR.position.set(0.25, 2.28, 0.45);
    browR.rotation.z = -0.1;
    browR.castShadow = true;
    character.add(browR);
    
    // CABELO
    const hairGroup = new THREE.Group();
    
    // Topo do cabelo
    const hairTopGeo = new THREE.SphereGeometry(0.45, 8);
    const hairTopMat = new THREE.MeshStandardMaterial({ color: hairColor });
    const hairTop = new THREE.Mesh(hairTopGeo, hairTopMat);
    hairTop.position.y = 2.3;
    hairTop.scale.set(1.1, 0.4, 1.1);
    hairTop.castShadow = true;
    hairGroup.add(hairTop);
    
    // Laterais
    const hairSideGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.3, 6);
    
    const hairSideL = new THREE.Mesh(hairSideGeo, hairTopMat);
    hairSideL.position.set(-0.45, 2.15, 0);
    hairSideL.rotation.z = 0.2;
    hairSideL.castShadow = true;
    hairGroup.add(hairSideL);
    
    const hairSideR = new THREE.Mesh(hairSideGeo, hairTopMat);
    hairSideR.position.set(0.45, 2.15, 0);
    hairSideR.rotation.z = -0.2;
    hairSideR.castShadow = true;
    hairGroup.add(hairSideR);
    
    // Franja
    const fringeGeo = new THREE.BoxGeometry(0.5, 0.15, 0.2);
    const fringe = new THREE.Mesh(fringeGeo, hairTopMat);
    fringe.position.set(0, 2.27, 0.35);
    fringe.castShadow = true;
    hairGroup.add(fringe);
    
    character.add(hairGroup);
    
    // BRAÇOS
    function createArm(side) {
      const armGroup = new THREE.Group();
      
      const upperArmGeo = new THREE.CylinderGeometry(0.2, 0.18, 0.8, 6);
      const armMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.4 });
      const upperArm = new THREE.Mesh(upperArmGeo, armMat);
      upperArm.position.y = -0.3;
      upperArm.castShadow = true;
      upperArm.receiveShadow = true;
      armGroup.add(upperArm);
      
      // Mão
      const handGeo = new THREE.SphereGeometry(0.15, 6);
      const handMat = new THREE.MeshStandardMaterial({ color: skinColor });
      const hand = new THREE.Mesh(handGeo, handMat);
      hand.position.y = -0.75;
      hand.castShadow = true;
      hand.receiveShadow = true;
      armGroup.add(hand);
      
      armGroup.position.x = side * 0.7;
      armGroup.position.y = 1.25;
      armGroup.rotation.z = side * 0.2;
      
      return armGroup;
    }
    
    const leftArm = createArm(-1);
    character.add(leftArm);
    
    const rightArm = createArm(1);
    character.add(rightArm);
    
    // CALÇAS
    const pantsGeo = new THREE.CylinderGeometry(0.45, 0.4, 0.8, 6);
    const pantsMat = new THREE.MeshStandardMaterial({ color: pantsColor });
    const pants = new THREE.Mesh(pantsGeo, pantsMat);
    pants.position.y = 0.4;
    pants.castShadow = true;
    pants.receiveShadow = true;
    character.add(pants);
    
    // PERNAS
    function createLeg(side) {
      const legGroup = new THREE.Group();
      
      const thighGeo = new THREE.CylinderGeometry(0.22, 0.2, 0.6, 6);
      const legMat = new THREE.MeshStandardMaterial({ color: pantsColor });
      const thigh = new THREE.Mesh(thighGeo, legMat);
      thigh.position.y = -0.2;
      thigh.castShadow = true;
      thigh.receiveShadow = true;
      legGroup.add(thigh);
      
      // Pé
      const footGeo = new THREE.BoxGeometry(0.25, 0.15, 0.4);
      const footMat = new THREE.MeshStandardMaterial({ color: shoeColor });
      const foot = new THREE.Mesh(footGeo, footMat);
      foot.position.set(0, -0.55, 0.1);
      foot.castShadow = true;
      foot.receiveShadow = true;
      legGroup.add(foot);
      
      legGroup.position.x = side * 0.25;
      legGroup.position.y = 0.2;
      
      return legGroup;
    }
    
    const leftLeg = createLeg(-1);
    character.add(leftLeg);
    
    const rightLeg = createLeg(1);
    character.add(rightLeg);
    
    // CINTO
    const beltGeo = new THREE.TorusGeometry(0.45, 0.06, 4, 8);
    beltGeo.rotateX(Math.PI / 2);
    const beltMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
    const belt = new THREE.MESH(beltGeo, beltMat);
    belt.position.y = 0.8;
    belt.castShadow = true;
    character.add(belt);
    
    // Posicionar personagem
    character.position.y = 0;
    character.position.z = 0;
    character.scale.set(1, 1, 1);
    
    scene.add(character);
    
    // ============================================
    // NUVENS FOFAS
    // ============================================
    
    function createCloud(x, y, z, scale) {
      const cloudGroup = new THREE.Group();
      
      const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x444444, transparent: true, opacity: 0.9 });
      
      const base = new THREE.Mesh(new THREE.SphereGeometry(0.8 * scale, 7), cloudMat);
      base.position.set(0, 0, 0);
      cloudGroup.add(base);
      
      const puff1 = new THREE.Mesh(new THREE.SphereGeometry(0.6 * scale, 6), cloudMat);
      puff1.position.set(0.7 * scale, 0.2 * scale, 0.2 * scale);
      cloudGroup.add(puff1);
      
      const puff2 = new THREE.Mesh(new THREE.SphereGeometry(0.7 * scale, 6), cloudMat);
      puff2.position.set(-0.7 * scale, 0.3 * scale, -0.1 * scale);
      cloudGroup.add(puff2);
      
      const puff3 = new THREE.Mesh(new THREE.SphereGeometry(0.5 * scale, 6), cloudMat);
      puff3.position.set(0.3 * scale, 0.5 * scale, 0.5 * scale);
      cloudGroup.add(puff3);
      
      const puff4 = new THREE.Mesh(new THREE.SphereGeometry(0.5 * scale, 6), cloudMat);
      puff4.position.set(-0.3 * scale, 0.6 * scale, -0.5 * scale);
      cloudGroup.add(puff4);
      
      cloudGroup.position.set(x, y, z);
      return cloudGroup;
    }
    
    // Adicionar nuvens no céu
    scene.add(createCloud(-4, 5, -3, 1.2));
    scene.add(createCloud(3, 6, -4, 1.5));
    scene.add(createCloud(5, 4, 4, 1.3));
    scene.add(createCloud(-3, 7, 5, 1.4));
    scene.add(createCloud(0, 8, -2, 1.1));
    
    // ============================================
    // ANIMAÇÃO
    // ============================================
    
    let clock = new THREE.Clock();
    
    function animate() {
      requestAnimationFrame(animate);
      
      const delta = clock.getDelta();
      const elapsedTime = performance.now() / 1000;
      
      // Animação suave de "respiração" (personagem sobe e desce levemente)
      character.position.y = Math.sin(elapsedTime * 2) * 0.02;
      
      // Animação dos braços (balanço suave)
      leftArm.rotation.x = Math.sin(elapsedTime * 3) * 0.1;
      rightArm.rotation.x = Math.sin(elapsedTime * 3 + Math.PI) * 0.1;
      
      // Piscar os olhos aleatoriamente
      if (Math.random() < 0.005) {
        // Fechar os olhos por um momento
        irisL.scale.y = 0.1;
        irisR.scale.y = 0.1;
        pupilL.scale.y = 0.1;
        pupilR.scale.y = 0.1;
        
        setTimeout(() => {
          irisL.scale.y = 1;
          irisR.scale.y = 1;
          pupilL.scale.y = 1;
          pupilR.scale.y = 1;
        }, 150);
      }
      
      // Atualizar controles
      controls.update();
      
      renderer.render(scene, camera);
    }
    
    animate();
    
    // ============================================
    // AJUSTE DE TELA
    // ============================================
    
    window.addEventListener('resize', onWindowResize, false);
    
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    // Pequeno ajuste na posição inicial da câmera
    camera.position.set(4, 2.5, 5);
    controls.target.set(0, 1.2, 0);
  </script>
</body>
</html>
